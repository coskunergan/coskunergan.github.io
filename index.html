<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Coşkun Ergan — Electrical and electronics engineer focused on embedded systems and hardware design.">
  <title>Coşkun ERGAN — Electrical &amp; Electronics Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090d;
      --border: #1e2236;
      --gold: #c8a96e;
      --text: #e8e4d8;
      --muted: #999bab;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; }
    #hero { min-height: 100vh; min-height: 100svh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 3rem 6rem; gap: 4rem; }
    .hero-left { min-width: 0; }
    h1 { font-size: clamp(1.7rem, 2.6vw, 2.7rem); line-height: 1.3; margin-bottom: 1rem; }
    .hero-tagline { color: var(--muted); font-size: .9rem; line-height: 1.9; max-width: 480px; margin-bottom: 1.5rem; }
    a { color: var(--gold); font-size: .8rem; text-underline-offset: 5px; transition: color .2s; }
    a:hover { color: var(--text); }
    a:focus-visible, canvas:focus-visible { outline: 1px solid var(--gold); outline-offset: 6px; }
    .hero-right { position: relative; height: 540px; min-width: 0; }
    #scope-canvas { display: block; width: 100%; height: 100%; border: 1px solid var(--border); background: var(--bg); cursor: crosshair; touch-action: pan-y; }
    .scope-freq { position: absolute; top: 1.2rem; right: 1.5rem; font-size: .65rem; color: var(--gold); pointer-events: none; }
    @media (max-width: 1000px) { #hero { padding: 3rem; gap: 2.5rem; } .hero-right { height: 440px; } }
    @media (max-width: 700px) { #hero { grid-template-columns: 1fr; padding: 3rem 1.5rem; gap: 2.5rem; align-content: center; } .hero-right { height: 320px; } .hero-tagline { font-size: .8rem; } }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main id="hero">
    <div class="hero-left">
      <h1>Coşkun <span>ERGAN</span></h1>
      <p class="hero-tagline">Electrical &amp; electronics engineer focused on embedded systems and hardware design.</p>
      <a href="https://github.com/coskunergan" target="_blank" rel="noopener noreferrer">github.com/coskunergan</a>
    </div>
    <div class="hero-right">
      <canvas id="scope-canvas" tabindex="0" role="img" aria-label="Animated oscilloscope. Move the pointer or use arrow keys to adjust frequency and amplitude. Time scale: 8 milliseconds per division."></canvas>
      <div class="scope-freq">50 Hz</div>
    </div>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('scope-canvas');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      const readout = document.querySelector('.scope-freq');
      const divisions = 10, secondsPerDivision = .008;
      const timeSpan = divisions * secondsPerDivision;
      let width = 0, height = 0, phase = 0, lastTime = null, frame = 0;
      let frequency = 50, amplitude = 1;
      const waves = [
        { frequency: 1, amplitude: .15, color: '#c8a96e', line: 2, type: 'sine' },
        { frequency: 2, amplitude: .08, color: '#3ee6e6', line: 1, type: 'square' },
        { frequency: 3, amplitude: .05, color: '#e63e3e', line: 1, type: 'sawtooth' }
      ];
      function value(type, t) {
        if (type === 'square') return Math.sin(t) >= 0 ? 1 : -1;
        if (type === 'sawtooth') return 2 * (t / (Math.PI * 2) - Math.floor(t / (Math.PI * 2))) - 1;
        return Math.sin(t);
      }
      function draw() {
        if (!width || !height) return;
        const plotLeft = 14, plotWidth = width - 28, plotHeight = height - 40;
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = '#1e2236'; ctx.lineWidth = 1; ctx.beginPath();
        for (let i = 0; i <= divisions; i++) { const x = plotLeft + i * plotWidth / divisions; ctx.moveTo(x, 0); ctx.lineTo(x, plotHeight); }
        for (let i = 0; i <= 6; i++) { const y = i * plotHeight / 6; ctx.moveTo(plotLeft, y); ctx.lineTo(plotLeft + plotWidth, y); }
        ctx.stroke();
        // Time coordinates are aligned with the vertical grid lines.
        ctx.font = '10px "JetBrains Mono", monospace';
        ctx.fillStyle = '#999bab'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#6b6e82'; ctx.beginPath();
        for (let i = 0; i <= divisions; i++) {
          const x = plotLeft + i * plotWidth / divisions;
          ctx.moveTo(x, plotHeight); ctx.lineTo(x, plotHeight + 4);
          ctx.fillText(String(Math.round(i * secondsPerDivision * 1000)), x, plotHeight + 15);
        }
        ctx.stroke();
        ctx.textAlign = 'right';
        ctx.fillText('t (ms)', plotLeft + plotWidth, plotHeight + 31);
        waves.forEach(wave => {
          ctx.beginPath(); ctx.strokeStyle = wave.color; ctx.lineWidth = wave.line;
          ctx.shadowColor = wave.color; ctx.shadowBlur = wave.line === 2 ? 8 : 4;
          for (let x = 0; x <= plotWidth; x++) {
            // An 80 ms window, animated in slow motion for legibility.
            const t = x / plotWidth * Math.PI * 2 * timeSpan * frequency * wave.frequency + phase * wave.frequency;
            const y = plotHeight / 2 - value(wave.type, t) * plotHeight * wave.amplitude * amplitude;
            if (!x) ctx.moveTo(plotLeft + x, y); else ctx.lineTo(plotLeft + x, y);
          }
          ctx.stroke(); ctx.shadowBlur = 0;
        });
        readout.textContent = frequency + ' Hz';
      }
      function tick(time) {
        if (document.hidden) { frame = 0; return; }
        if (lastTime !== null) phase = (phase + Math.min((time - lastTime) / 1000, .05) * 1.5 * frequency / 50) % (Math.PI * 2);
        lastTime = time; draw(); frame = requestAnimationFrame(tick);
      }
      function refresh() {
        cancelAnimationFrame(frame); lastTime = null; frame = 0; draw();
        if (!document.hidden) frame = requestAnimationFrame(tick);
      }
      function resize() {
        width = canvas.clientWidth; height = canvas.clientHeight;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0); draw();
      }
      canvas.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch') return;
        const b = canvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (event.clientX - b.left) / b.width));
        const y = Math.max(0, Math.min(1, (event.clientY - b.top) / b.height));
        frequency = Math.round(20 + x * 80); amplitude = 1.7 - y * 1.4; draw();
      });
      canvas.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
        event.preventDefault();
        if (event.key === 'ArrowLeft') frequency = Math.max(20, frequency - 2);
        if (event.key === 'ArrowRight') frequency = Math.min(100, frequency + 2);
        if (event.key === 'ArrowUp') amplitude = Math.min(1.7, amplitude + .1);
        if (event.key === 'ArrowDown') amplitude = Math.max(.3, amplitude - .1);
        draw();
      });
      document.addEventListener('visibilitychange', refresh);
      new ResizeObserver(resize).observe(canvas);
      resize(); refresh();
    })();
  </script>
</body>
</html>
